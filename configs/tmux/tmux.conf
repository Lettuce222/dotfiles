set -g prefix C-Space

unbind C-b

# Pane splitting
bind -r - split-window -v -c "#{pane_current_path}"
bind -r | split-window -h -c "#{pane_current_path}"

# Pane navigation
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Kill pane without confirmation
bind -r x kill-pane

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

set-option -g mouse on
#
set-option -g status-justify "left"
set-window-option -g mode-keys vi
set-option -g history-limit 64096
#
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi V send-keys -X select-line

bind g run-shell 'tmux popup -E -w90% -h90% -d #{pane_current_path} lazygit || exit'
bind e run-shell 'tmux popup -E -w90% -h90% -d #{pane_current_path} nvim || exit'

# PR URL を貼って worktree + window を開く
bind p display-popup -E -w 80% -h 40% "~/.config/tmux/scripts/tm-pr.fish"

set -g escape-time 0
set -g focus-events on

# Homebrew の tmuxinator wrapper は `GEM_HOME=... exec ...` で子プロセスに
# tmuxinator 自身の libexec を環境変数として渡す。tmux server が起動時に
# その GEM_HOME を継承して global environment に保持してしまい、以降の
# 全 pane で `gem env` などが tmuxinator の libexec を指してしまうため除去する。
set-environment -gu GEM_HOME

# ウィンドウにフォーカスした時に Claude の idle マーカー🟢 を外す (🔴🟡 は残す)
set-hook -g session-window-changed 'run-shell -b "bash ~/.claude/hooks/clear-green-tmux-window-title.sh"'

# vim: ft=tmux
set -g mode-style "fg=#1a1b26,bg=#e0af68"

set -g message-style "fg=#c0caf5,bg=#1f2335"
set -g message-command-style "fg=#c0caf5,bg=#1f2335"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-bg "#1f2335"
set -g status-fg "#a9b1d6"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left ""
set -g status-right ""

set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#7e89ac,bg=#1f2335"
setw -g window-status-format '#[fg=#1f2335,bg=#1f2335]#[default] #I  #{?#{!=:#{window_name},#{b:pane_current_path}},#W,#{b:pane_current_path}} #[fg=#1f2335,bg=#1f2335,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#1a1b26,bg=#7aa2f7]#[fg=#1a1b26,bg=#7aa2f7] #I #[fg=#1a1b26,bg=#7aa2f7] #{?#{!=:#{window_name},#{b:pane_current_path}},#W,#{b:pane_current_path}} #[fg=#7aa2f7,bg=#1f2335,nobold]'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ペインボーダーの色を設定する
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# 非アクティブペインの背景を沈ませてアクティブペインを際立たせる
set -g window-style "bg=#1f2335"
set -g window-active-style "bg=#24283b"

# クリップボード統合の強化
set -g set-clipboard on
