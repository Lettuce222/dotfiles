<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デスク</title>
<link rel="stylesheet" href="/desk.css">
</head>
<body>
<header>
  <h1>デスク</h1>
  <label class="add"><kbd>a</kbd><input id="add" placeholder="頭にあることを 1 行で inbox へ" autocomplete="off"></label>
  <span class="agents" id="agents"></span>
</header>
<div class="alert" id="alert" hidden></div>
<main>
  <section class="pane on" id="items"></section>
  <section class="pane on" id="detail"></section>
  <section class="pane" id="migrate"></section>
</main>
<footer>
  <span><kbd>q</kbd><kbd>w</kbd><kbd>e</kbd><kbd>r</kbd><kbd>t</kbd><kbd>y</kbd><kbd>u</kbd><kbd>i</kbd> 節へ（i は移し替え、<kbd>Esc</kbd> で戻る）</span><span><kbd>j</kbd>/<kbd>k</kbd> 上下（開いた節をまたぐ。右に詳細）</span><span><kbd>a</kbd> 追加</span>
  <span><kbd>s</kbd> エディタ</span><span><kbd>d</kbd> 成果物</span><span><kbd>f</kbd> 移す</span><span><kbd>x</kbd> 完了</span>
  <span><kbd>g</kbd>+<kbd>y</kbd><kbd>i</kbd><kbd>n</kbd><kbd>p</kbd><kbd>w</kbd><kbd>s</kbd><kbd>r</kbd><kbd>m</kbd> 節へ</span><span>見出しを押すと畳む・開く</span>
  <span>窓口の問い: <kbd>⇧Q</kbd>〜<kbd>⇧R</kbd> で答える、<kbd>Enter</kbd> で書いて答える（<kbd>⌘</kbd>+<kbd>Enter</kbd> で送る）</span>
</footer>
<div class="menu-back" id="menu"></div>
<div class="toast" id="toast"></div>
<script type="module" src="/desk.mjs"></script>
</body>
</html>
