[tools]
fd = "latest"
fzf = "latest"
nodejs = "latest"
direnv = "latest"
tmux = "latest"
bat = "latest"
rg = "latest"
ghq = "latest"
lazygit = "latest"
gh = "latest"
marksman = "latest"
# Markdown のターミナルビューア。tmux の file:// リンクで .md を開くのに使う。
"github:rivolink/leaf" = "latest"
go = "latest"
delta = "latest"
eza = "latest"
zoxide = "latest"
node = "latest"
# PyYAML などのライブラリは、どの版の python からも import できるよう、入れたときに pip で入れる。
# pypi: の backend は CLI を別の venv に入れるので、ライブラリには合わない。
python = { version = "latest", postinstall = '"$MISE_TOOL_INSTALL_PATH/bin/python3" -m pip install --quiet -r "$HOME/.config/mise/default-python-packages"' }

# Linter/Formatter
stylua = "latest"
shfmt = "latest"
shellcheck = "latest"
taplo = "latest"
gitleaks = "latest"
yazi = "latest"
yq = "latest"

[settings]
paranoid = true
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["ruby", "node"]
